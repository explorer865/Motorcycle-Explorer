<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>SG Explorer PWA</title>
  <meta name="description" content="Track your Singapore road exploration by motorcycle using SLA OneMap: live GPS, road-snapped routes and cumulative SG road coverage." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SG Explorer" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" id="appleIcon" href="" />
  <link rel="icon" id="favIcon" href="" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Inline PWA manifest + generated icons -->
  <script>
    (function () {
      function makeIcon(size) {
        var c = document.createElement('canvas');
        c.width = c.height = size;
        var x = c.getContext('2d');
        var s = size / 512;
        var g = x.createLinearGradient(0, 0, size, size);
        g.addColorStop(0, '#1e293b'); g.addColorStop(1, '#0f172a');
        x.fillStyle = g; x.fillRect(0, 0, size, size);
        x.lineCap = 'round'; x.lineJoin = 'round';
        x.shadowColor = '#fbbf24'; x.shadowBlur = 40 * s;
        x.strokeStyle = '#fbbf24'; x.lineWidth = 34 * s;
        x.beginPath();
        x.moveTo(96 * s, 380 * s);
        x.bezierCurveTo(170 * s, 250 * s, 250 * s, 410 * s, 320 * s, 270 * s);
        x.bezierCurveTo(360 * s, 190 * s, 390 * s, 160 * s, 420 * s, 130 * s);
        x.stroke();
        x.shadowBlur = 0;
        x.fillStyle = '#34d399';
        x.beginPath(); x.arc(96 * s, 380 * s, 34 * s, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#fff';
        x.beginPath(); x.arc(420 * s, 130 * s, 30 * s, 0, Math.PI * 2); x.fill();
        return c.toDataURL('image/png');
      }
      try {
        var i192 = makeIcon(192), i512 = makeIcon(512), i180 = makeIcon(180);
        document.getElementById('appleIcon').href = i180;
        document.getElementById('favIcon').href = i192;
        var base = location.href.split('#')[0].split('?')[0];
        var scope = base.substring(0, base.lastIndexOf('/') + 1);
        var manifest = {
          name: 'SG Explorer PWA',
          short_name: 'SG Explorer',
          description: 'Track Singapore road exploration and coverage with SLA OneMap.',
          start_url: base,
          scope: scope,
          display: 'standalone',
          orientation: 'any',
          background_color: '#0f172a',
          theme_color: '#0f172a',
          icons: [
            { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(link);
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --app-h: 100vh;
      --bar-h: 88px;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      height: 100%;
      height: var(--app-h);
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    body { position: fixed; inset: 0; }

    #map {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100vh;
      height: var(--app-h);
      height: 100dvh;
      z-index: 0;
      background: #0f172a;
      touch-action: none;
    }
    .leaflet-container { font-family: inherit; background: #0f172a; }
    .leaflet-bottom { bottom: calc(var(--bar-h) + var(--sab) + 8px); }
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, .78) !important;
      color: #94a3b8 !important;
      font-size: 9px !important;
      border-radius: 6px 0 0 6px;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .leaflet-control-attribution a { color: #fbbf24 !important; }

    /* Glowing ridden roads */
    .leaflet-rides-pane svg { filter: drop-shadow(0 0 4px rgba(251, 191, 36, .9)); }
    .leaflet-live-pane svg { filter: drop-shadow(0 0 4px rgba(52, 211, 153, .85)); }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #1e293b; color: #e2e8f0;
      border: 1px solid rgba(71, 85, 105, .6);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    .leaflet-popup-content { margin: 10px 14px; font-size: 13px; line-height: 1.4; }
    .leaflet-container a.leaflet-popup-close-button { color: #94a3b8; }

    .user-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: #fbbf24; border: 3px solid #fff;
      box-shadow: 0 0 0 0 rgba(251, 191, 36, .7);
      animation: pulse 1.8s infinite;
    }
    .user-dot.sim { background: #34d399; box-shadow: 0 0 0 0 rgba(52, 211, 153, .7); animation-name: pulseG; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(251,191,36,.7);} 70% { box-shadow: 0 0 0 18px rgba(251,191,36,0);} 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0);} }
    @keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.7);} 70% { box-shadow: 0 0 0 18px rgba(52,211,153,0);} 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0);} }

    .glass {
      background: linear-gradient(180deg, rgba(30, 41, 59, .88), rgba(15, 23, 42, .9));
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid rgba(71, 85, 105, .55);
      box-shadow: 0 12px 40px rgba(2, 6, 23, .55), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .glow-amber { color: #fbbf24; text-shadow: 0 0 14px rgba(251, 191, 36, .55); }
    .glow-emerald { color: #34d399; text-shadow: 0 0 14px rgba(52, 211, 153, .5); }

    .act {
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
      transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease, opacity .2s ease, border-color .2s;
      border: 1px solid rgba(71, 85, 105, .6);
      background: rgba(30, 41, 59, .9);
    }
    .act:active:not(:disabled) { transform: scale(.94); }
    .act:disabled { opacity: .38; cursor: not-allowed; }
    .act-record { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #1c1917; border-color: #fcd34d; box-shadow: 0 0 24px rgba(251,191,36,.35); }
    .act-record[data-state="on"] { background: linear-gradient(180deg, #f43f5e, #e11d48); color: #fff; border-color: #fb7185; box-shadow: 0 0 26px rgba(244,63,94,.5); animation: recGlow 1.6s ease-in-out infinite; }
    .act-sim[data-state="on"] { background: linear-gradient(180deg, #10b981, #059669); color: #fff; border-color: #6ee7b7; box-shadow: 0 0 24px rgba(16,185,129,.45); }
    .act-sim { color: #6ee7b7; }
    .act-reset { color: #fda4af; }
    @keyframes recGlow { 50% { box-shadow: 0 0 36px rgba(244,63,94,.75); } }

    .fab {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #e2e8f0;
    }
    .fab[data-active="true"] { color: #fbbf24; border-color: rgba(251,191,36,.75); box-shadow: 0 0 18px rgba(251,191,36,.25); }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; }
    .status-dot.red { background: #f43f5e; box-shadow: 0 0 10px #f43f5e; animation: blink 1s steps(2) infinite; }
    .status-dot.amber { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; animation: blink 1.4s ease-in-out infinite; }
    .status-dot.slate { background: #64748b; box-shadow: none; }
    @keyframes blink { 50% { opacity: .35; } }

    .progress-track { background: rgba(51, 65, 85, .7); }
    .progress-fill {
      background: linear-gradient(90deg, #34d399, #fbbf24);
      box-shadow: 0 0 12px rgba(251, 191, 36, .6);
      transition: width .6s cubic-bezier(.2,.8,.2,1);
    }

    .spinner { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(251,191,36,.2); border-top-color: #fbbf24; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { animation: toastIn .25s cubic-bezier(.2,.8,.2,1); }
    .toast.out { animation: toastOut .25s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-8px) scale(.98); } }

    .sheet-enter { animation: sheetIn .28s cubic-bezier(.2,.8,.2,1); }
    @keyframes sheetIn { from { opacity: 0; transform: translateY(24px) scale(.98); } }

    .hidden-i { display: none !important; }
  </style>
</head>
<body>

  <!-- Map -->
  <div id="map" aria-label="OneMap Singapore"></div>

  <!-- Top HUD -->
  <header id="hud" class="fixed top-0 left-0 right-0 z-[1000] pointer-events-none"
          style="padding: calc(var(--sat) + 10px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);">
    <div class="glass pointer-events-auto mx-auto max-w-xl rounded-2xl overflow-hidden">
      <div class="flex items-center justify-between px-3.5 pt-3 pb-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 shrink-0 rounded-xl bg-amber-400/15 border border-amber-400/40 flex items-center justify-center shadow-[0_0_18px_rgba(251,191,36,.25)]">
            <svg viewBox="0 0 24 24" class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19c3-5 6 1 9-4s4-7 7-9" /><circle cx="4" cy="19" r="1.6" fill="currentColor" /><circle cx="20" cy="6" r="1.6" fill="currentColor" />
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 class="font-display font-bold text-[15px] leading-tight tracking-tight text-slate-50 truncate">SG Explorer</h1>
              <span class="text-[9px] font-mono uppercase tracking-wider px-1.5 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-400/30">SLA OneMap</span>
            </div>
            <p id="subline" class="text-[11px] text-slate-400 leading-tight truncate">0 rides logged</p>
          </div>
        </div>
        <div id="statusPill" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800/90 border border-slate-700 text-[11px] font-semibold tracking-wide uppercase text-slate-300 shrink-0">
          <span id="statusDot" class="status-dot"></span><span id="statusText">Ready</span>
        </div>
      </div>

      <div class="grid grid-cols-3 divide-x divide-slate-700/70 border-t border-slate-700/60">
        <div class="px-2 py-2.5 text-center">
          <div class="text-[10px] font-semibold uppercase tracking-[.12em] text-slate-400">SG Coverage</div>
          <div class="num font-bold text-[22px] leading-7 glow-amber"><span id="covVal">0.00</span><span class="text-[13px] text-amber-300/80">%</span></div>
          <div class="num text-[10px] text-slate-500"><span id="covKm">0.0</span> / 3,425 km</div>
        </div>
        <div class="px-2 py-2.5 text-center">
          <div class="text-[10px] font-semibold uppercase tracking-[.12em] text-slate-400">Total Dist</div>
          <div class="num font-bold text-[22px] leading-7 text-slate-50"><span id="distVal">0.00</span><span class="text-[13px] text-slate-400"> km</span></div>
          <div class="num text-[10px] text-slate-500" id="distSub">all rides</div>
        </div>
        <div class="px-2 py-2.5 text-center">
          <div class="text-[10px] font-semibold uppercase tracking-[.12em] text-slate-400">Speed</div>
          <div class="num font-bold text-[22px] leading-7 glow-emerald"><span id="spdVal">0</span><span class="text-[13px] text-emerald-300/80"> km/h</span></div>
          <div class="num text-[10px] text-slate-500" id="spdSub">idle</div>
        </div>
      </div>
      <div class="progress-track h-1 w-full">
        <div id="covBar" class="progress-fill h-1" style="width:0%"></div>
      </div>
    </div>

    <!-- Toasts -->
    <div id="toasts" class="mx-auto max-w-xl mt-2 flex flex-col gap-2 items-center"></div>
  </header>

  <!-- Floating map controls -->
  <div id="fabs" class="fixed z-[1000] flex flex-col gap-2"
       style="right: calc(var(--sar) + 12px); bottom: calc(var(--bar-h) + var(--sab) + 34px);">
    <button id="btnLandLot" class="act fab glass" aria-label="Toggle SLA LandLot Cadastral Overlay" title="SLA LandLot Overlay" data-active="false">
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    </button>
    <button id="btnLayers" class="act fab glass" aria-label="Switch OneMap Style" title="OneMap Theme (Night / Default / Grey / Original)">
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button id="btnFit" class="act fab glass" aria-label="Show all rides" title="Show all rides">
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="btnLocate" class="act fab glass" aria-label="Center on my location" title="My location" data-active="false">
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
    </button>
  </div>

  <!-- Live ride chip -->
  <div id="liveChip" class="hidden-i fixed z-[1000] glass rounded-xl px-3 py-2 flex items-center gap-3"
       style="left: calc(var(--sal) + 12px); bottom: calc(var(--bar-h) + var(--sab) + 34px);">
    <div>
      <div class="text-[9px] uppercase tracking-[.14em] text-slate-400 font-semibold" id="liveLabel">Ride</div>
      <div class="num text-sm font-bold text-slate-50" id="liveTime">00:00</div>
    </div>
    <div class="w-px h-7 bg-slate-700"></div>
    <div>
      <div class="text-[9px] uppercase tracking-[.14em] text-slate-400 font-semibold">This ride</div>
      <div class="num text-sm font-bold glow-amber"><span id="liveKm">0.00</span> km</div>
    </div>
    <div class="w-px h-7 bg-slate-700"></div>
    <div>
      <div class="text-[9px] uppercase tracking-[.14em] text-slate-400 font-semibold">Points</div>
      <div class="num text-sm font-bold text-emerald-300" id="livePts">0</div>
    </div>
  </div>

  <!-- Bottom action bar -->
  <nav id="actionbar" class="fixed bottom-0 left-0 right-0 z-[1000] pointer-events-none"
       style="padding: 0 calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);">
    <div class="glass pointer-events-auto mx-auto max-w-xl rounded-2xl p-2 grid grid-cols-[1.35fr_1fr_.8fr] gap-2" id="barInner">
      <button id="btnRecord" class="act act-record rounded-xl h-[60px] flex items-center justify-center gap-2 font-display font-bold text-[15px]" data-state="off" aria-pressed="false">
        <span id="recIcon" class="inline-flex"></span><span id="recText">Record Ride</span>
      </button>
      <button id="btnSim" class="act act-sim rounded-xl h-[60px] flex items-center justify-center gap-2 font-display font-semibold text-[14px]" data-state="off" aria-pressed="false">
        <span id="simIcon" class="inline-flex"></span><span id="simText">Simulate</span>
      </button>
      <button id="btnReset" class="act act-reset rounded-xl h-[60px] flex flex-col items-center justify-center font-display font-semibold text-[11px]" aria-label="Clear all data">
        <svg viewBox="0 0 24 24" class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
        Reset
      </button>
    </div>
  </nav>

  <!-- Snapping overlay -->
  <div id="snapOverlay" class="hidden-i fixed inset-0 z-[2000] flex items-center justify-center bg-slate-950/55 backdrop-blur-sm">
    <div class="glass rounded-2xl px-6 py-5 flex flex-col items-center gap-3 mx-6 max-w-xs text-center sheet-enter">
      <div class="spinner"></div>
      <div class="font-display font-semibold text-slate-50">Snapping to SG roads</div>
      <div id="snapText" class="text-xs text-slate-400 num">Contacting OSRM…</div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden-i fixed inset-0 z-[3000] flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm"
       style="padding: 16px calc(var(--sar) + 12px) calc(var(--sab) + 16px) calc(var(--sal) + 12px);" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="glass rounded-2xl w-full max-w-sm p-5 sheet-enter">
      <h2 id="modalTitle" class="font-display font-bold text-lg text-slate-50"></h2>
      <p id="modalBody" class="text-sm text-slate-300 mt-2 leading-relaxed"></p>
      <div class="grid grid-cols-2 gap-2 mt-5">
        <button id="modalCancel" class="act rounded-xl h-12 font-semibold text-slate-200"></button>
        <button id="modalOk" class="act rounded-xl h-12 font-bold"></button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ================================================================
       Config
       ================================================================ */
    var CFG = {
      BASELINE_KM: 3425.0,
      CENTER: [1.3521, 103.8198],
      ZOOM: 13,
      OSRM_MATCH: 'https://router.project-osrm.org/match/v1/driving/',
      CHUNK: 10,
      CHUNK_DELAY_MS: 1100,
      STORE_KEY: 'sgx.v1.data',
      ACTIVE_KEY: 'sgx.v1.active',
      PREFS_KEY: 'sgx.v3.prefs',
      CELL_DEG: 0.00025,       // ~28 m coverage grid
      SAMPLE_M: 20,            // coverage sampling step
      MIN_STEP_M: 5,           // ignore GPS movement smaller than this
      MAX_ACC_M: 50,           // ignore fixes worse than this
      MIN_SAVE_KM: 0.05,
      SIM_TICK_MS: 250,
      SIM_SECONDS_PER_TICK: 2
    };

    var ECP_ROUTE = [
      [1.29429,103.86595],[1.29519,103.87033],[1.29543,103.87346],[1.29550,103.87587],[1.29561,103.87929],
      [1.29576,103.88207],[1.29585,103.88459],[1.29576,103.88957],[1.29565,103.89206],[1.29602,103.89435],
      [1.29706,103.89713],[1.29835,103.90055],[1.29970,103.90419],[1.30054,103.90686],[1.30139,103.90986],
      [1.30244,103.91346],[1.30342,103.91700],[1.30408,103.91932],[1.30475,103.92166],[1.30566,103.92498],
      [1.30677,103.92768],[1.30777,103.92990],[1.30838,103.93206],[1.30906,103.93450],[1.30988,103.93734],
      [1.31157,103.94333],[1.31181,103.94557],[1.31194,103.94971],[1.31257,103.95226],[1.31664,103.96219],
      [1.31806,103.96565],[1.31930,103.96769],[1.32222,103.97001],[1.32262,103.97029]
    ];

    // Official Singapore Land Authority (SLA) OneMap Basemaps (No API key required)
    var ONEMAP_ATTR = '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:14px;width:14px;display:inline;"/> <a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener noreferrer">OneMap</a> &copy; contributors | <a href="https://www.sla.gov.sg/" target="_blank" rel="noopener noreferrer">Singapore Land Authority</a>';

    var TILES = {
      onemap_night: {
        name: 'SLA OneMap Night',
        url: 'https://www.onemap.gov.sg/maps/tiles/Night/{z}/{x}/{y}.png',
        opts: { detectRetina: true, maxZoom: 19, minZoom: 11, attribution: ONEMAP_ATTR }
      },
      onemap_default: {
        name: 'SLA OneMap Default',
        url: 'https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png',
        opts: { detectRetina: true, maxZoom: 19, minZoom: 11, attribution: ONEMAP_ATTR }
      },
      onemap_grey: {
        name: 'SLA OneMap Grey',
        url: 'https://www.onemap.gov.sg/maps/tiles/Grey/{z}/{x}/{y}.png',
        opts: { detectRetina: true, maxZoom: 19, minZoom: 11, attribution: ONEMAP_ATTR }
      },
      onemap_original: {
        name: 'SLA OneMap Original',
        url: 'https://www.onemap.gov.sg/maps/tiles/Original/{z}/{x}/{y}.png',
        opts: { detectRetina: true, maxZoom: 19, minZoom: 11, attribution: ONEMAP_ATTR }
      }
    };
    var TILE_ORDER = ['onemap_night', 'onemap_default', 'onemap_grey', 'onemap_original'];

    /* ================================================================
       Helpers
       ================================================================ */
    var $ = function (id) { return document.getElementById(id); };
    var R_EARTH = 6371008.8;
    function toRad(d) { return d * Math.PI / 180; }
    function hav(a, b) {
      var dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
      var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(s)));
    }
    function pathLenM(pts) { var m = 0; for (var i = 1; i < pts.length; i++) m += hav(pts[i - 1], pts[i]); return m; }
    function r5(n) { return Math.round(n * 1e5) / 1e5; }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function haptic(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
    function fmtKm(km) { return km < 100 ? km.toFixed(2) : km < 1000 ? km.toFixed(1) : Math.round(km).toLocaleString(); }
    function fmtPct(p) { return p < 1 ? p.toFixed(3) : p < 10 ? p.toFixed(2) : p.toFixed(1); }
    function fmtDur(sec) {
      sec = Math.max(0, Math.floor(sec));
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      var mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
      return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
    }
    function lsGet(k, fb) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

    var ICONS = {
      rec: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>',
      stop: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
      play: '<svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>'
    };

    /* ================================================================
       Viewport handling
       ================================================================ */
    function syncViewport() {
      var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
      var bar = $('barInner');
      if (bar) document.documentElement.style.setProperty('--bar-h', Math.round(bar.offsetHeight) + 'px');
    }
    syncViewport();

    /* ================================================================
       Map & SLA OneMap Layers
       ================================================================ */
    var prefs = lsGet(CFG.PREFS_KEY, { tiles: 'onemap_night', landlot: false });
    if (!TILES[prefs.tiles]) prefs.tiles = 'onemap_night';

    var map = L.map('map', {
      zoomControl: false,
      attributionControl: true,
      preferCanvas: false,
      worldCopyJump: false,
      maxBounds: L.latLngBounds([1.12, 103.55], [1.50, 104.12]),
      maxBoundsViscosity: 0.85,
      minZoom: 11,
      maxZoom: 19
    }).setView(CFG.CENTER, CFG.ZOOM);
    map.attributionControl.setPrefix(false);

    var tileLayer = null;
    function setTiles(key) {
      var t = TILES[key];
      if (tileLayer) map.removeLayer(tileLayer);
      tileLayer = L.tileLayer(t.url, Object.assign({ keepBuffer: 4 }, t.opts)).addTo(map);
      if (landLotLayer && prefs.landlot) landLotLayer.bringToFront();
      prefs.tiles = key;
      lsSet(CFG.PREFS_KEY, prefs);
    }

    // SLA OneMap LandLot Cadastral Overlay (transparent lot boundaries & numbers)
    var landLotLayer = L.tileLayer('https://www.onemap.gov.sg/maps/tiles/LandLot/{z}/{x}/{y}.png', {
      detectRetina: true,
      maxZoom: 19,
      minZoom: 11,
      opacity: 0.72,
      zIndex: 250,
      attribution: ONEMAP_ATTR
    });

    function toggleLandLot(forceState) {
      var nextState = typeof forceState === 'boolean' ? forceState : !prefs.landlot;
      prefs.landlot = nextState;
      lsSet(CFG.PREFS_KEY, prefs);
      $('btnLandLot').dataset.active = nextState ? 'true' : 'false';
      if (nextState) {
        landLotLayer.addTo(map);
        landLotLayer.bringToFront();
      } else {
        map.removeLayer(landLotLayer);
      }
    }

    setTiles(prefs.tiles);
    if (prefs.landlot) toggleLandLot(true);

    map.createPane('rides').style.zIndex = 410;
    map.createPane('live').style.zIndex = 420;
    var ridesRenderer = L.svg({ pane: 'rides', padding: 0.5 });
    var liveRenderer = L.svg({ pane: 'live', padding: 0.5 });
    var ridesLayer = L.layerGroup().addTo(map);

    var liveLine = L.polyline([], { renderer: liveRenderer, color: '#34d399', weight: 4, opacity: 0.95, dashArray: '2 8', lineCap: 'round', interactive: false }).addTo(map);
    var userMarker = null, accCircle = null;

    function updateUserMarker(lat, lng, acc, isSim) {
      var ll = [lat, lng];
      if (!userMarker) {
        userMarker = L.marker(ll, {
          icon: L.divIcon({ className: '', html: '<div class="user-dot' + (isSim ? ' sim' : '') + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
          interactive: false, keyboard: false, zIndexOffset: 1000
        }).addTo(map);
        accCircle = L.circle(ll, { radius: acc || 10, color: '#fbbf24', weight: 1, opacity: 0.4, fillOpacity: 0.08, interactive: false }).addTo(map);
      } else {
        userMarker.setLatLng(ll);
        accCircle.setLatLng(ll).setRadius(acc || 10);
      }
      var dot = userMarker.getElement() && userMarker.getElement().firstChild;
      if (dot) dot.classList.toggle('sim', !!isSim);
      accCircle.setStyle({ color: isSim ? '#34d399' : '#fbbf24' });
    }
    function clearUserMarker() {
      if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
      if (accCircle) { map.removeLayer(accCircle); accCircle = null; }
    }

    var resizeT = null;
    function onViewportChange() {
      clearTimeout(resizeT);
      resizeT = setTimeout(function () { syncViewport(); map.invalidateSize({ pan: false }); }, 120);
    }
    window.addEventListener('resize', onViewportChange);
    window.addEventListener('orientationchange', function () { setTimeout(onViewportChange, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onViewportChange);
    window.addEventListener('load', function () { syncViewport(); map.invalidateSize(); });
    setTimeout(function () { map.invalidateSize(); }, 250);

    /* ================================================================
       Data, persistence & coverage
       ================================================================ */
    var data = lsGet(CFG.STORE_KEY, null);
    if (!data || !Array.isArray(data.rides)) data = { v: 1, rides: [], totalKm: 0 };

    var cells = new Set();
    var coverageKm = 0;

    function cellKey(lat, lng) { return Math.round(lat / CFG.CELL_DEG) + ':' + Math.round(lng / CFG.CELL_DEG); }

    function coverSeg(seg, set) {
      var added = 0;
      for (var i = 1; i < seg.length; i++) {
        var a = seg[i - 1], b = seg[i];
        var d = hav(a, b);
        if (d <= 0 || d > 3000) continue;
        var n = Math.max(1, Math.ceil(d / CFG.SAMPLE_M)), step = d / n;
        for (var k = 0; k < n; k++) {
          var f = (k + 0.5) / n;
          var key = cellKey(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
          if (!set.has(key)) { set.add(key); added += step; }
        }
      }
      return added / 1000;
    }

    function recomputeCoverage() {
      cells = new Set();
      coverageKm = 0;
      data.rides.forEach(function (r) {
        (r.segs || []).forEach(function (s) {
          coverageKm += coverSeg(s, cells);
        });
      });
    }

    function totalKm() {
      var sum = 0;
      data.rides.forEach(function (r) { sum += (r.km || 0); });
      return sum;
    }

    function saveData() {
      data.totalKm = totalKm();
      lsSet(CFG.STORE_KEY, data);
    }

    function renderAllRides() {
      ridesLayer.clearLayers();
      recomputeCoverage();
      data.rides.forEach(function (r) {
        (r.segs || []).forEach(function (seg) {
          if (seg.length < 2) return;
          L.polyline(seg, { renderer: ridesRenderer, color: '#f59e0b', weight: 10, opacity: 0.35, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(ridesLayer);
          var core = L.polyline(seg, { renderer: ridesRenderer, color: '#fde047', weight: 4, opacity: 1.0, lineCap: 'round', lineJoin: 'round' }).addTo(ridesLayer);
          var dt = r.start ? new Date(r.start).toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Saved ride';
          core.bindPopup('<strong>' + dt + '</strong><br/>Distance: ' + fmtKm(r.km || 0) + ' km');
        });
      });
      updateHUD();
    }

    /* ================================================================
       UI & Toast Helpers
       ================================================================ */
    function toast(msg, type, ms) {
      var wrap = $('toasts');
      var el = document.createElement('div');
      var border = type === 'warn' ? 'border-amber-400/50 text-amber-200' : type === 'err' ? 'border-rose-400/50 text-rose-200' : 'border-slate-600/70 text-slate-100';
      el.className = 'toast glass pointer-events-auto px-3.5 py-2 rounded-full text-xs font-medium border ' + border;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
      }, ms || 2600);
    }

    function confirmModal(opts) {
      return new Promise(function (resolve) {
        $('modalTitle').textContent = opts.title || 'Confirm';
        $('modalBody').textContent = opts.body || '';
        $('modalCancel').textContent = opts.cancel || 'Cancel';
        var ok = $('modalOk');
        ok.textContent = opts.confirm || 'OK';
        ok.className = 'act rounded-xl h-12 font-bold ' + (opts.danger ? 'bg-rose-600 text-white border-rose-400' : 'bg-amber-400 text-slate-950 border-amber-300');
        $('modal').classList.remove('hidden-i');

        function cleanup(res) {
          $('modal').classList.add('hidden-i');
          $('modalCancel').onclick = null;
          ok.onclick = null;
          resolve(res);
        }
        $('modalCancel').onclick = function () { cleanup(false); };
        ok.onclick = function () { cleanup(true); };
      });
    }

    function setStatus(text, dotClass) {
      $('statusText').textContent = text;
      $('statusDot').className = 'status-dot' + (dotClass ? ' ' + dotClass : '');
    }

    function updateHUD(liveNewKm, liveTotalKm, speedKmh) {
      var cov = coverageKm + (liveNewKm || 0);
      var tot = totalKm() + (liveTotalKm || 0);
      var pct = Math.min(100, (cov / CFG.BASELINE_KM) * 100);

      $('covVal').textContent = fmtPct(pct);
      $('covKm').textContent = cov.toFixed(1);
      $('covBar').style.width = pct + '%';
      $('distVal').textContent = fmtKm(tot);
      $('subline').textContent = data.rides.length + (data.rides.length === 1 ? ' ride logged' : ' rides logged');

      if (typeof speedKmh === 'number') {
        $('spdVal').textContent = Math.round(speedKmh);
        $('spdSub').textContent = speedKmh > 0 ? 'moving' : 'stopped';
      } else {
        $('spdVal').textContent = '0';
        $('spdSub').textContent = 'idle';
      }
    }

    /* ================================================================
       OSRM Map-Matching
       ================================================================ */
    async function snapToOSRM(pts) {
      if (!pts || pts.length < 2) return [pts];
      $('snapOverlay').classList.remove('hidden-i');
      var segs = [];
      try {
        var totalChunks = Math.ceil(pts.length / (CFG.CHUNK - 1));
        for (var i = 0; i < pts.length - 1; i += (CFG.CHUNK - 1)) {
          var chunk = pts.slice(i, i + CFG.CHUNK);
          if (chunk.length < 2) continue;
          var chunkIdx = Math.floor(i / (CFG.CHUNK - 1)) + 1;
          $('snapText').textContent = 'Matching segment ' + chunkIdx + ' / ' + totalChunks + '…';

          var coords = chunk.map(function (p) { return r5(p[1]) + ',' + r5(p[0]); }).join(';');
          var radiuses = chunk.map(function () { return '25'; }).join(';');
          var url = CFG.OSRM_MATCH + coords + '?geometries=geojson&overview=full&tidy=true&radiuses=' + radiuses;

          try {
            var res = await fetch(url);
            if (res.ok) {
              var json = await res.json();
              if (json.code === 'Ok' && json.matchings && json.matchings.length) {
                json.matchings.forEach(function (m) {
                  var mapped = m.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
                  if (mapped.length > 1) segs.push(mapped);
                });
              } else {
                segs.push(chunk);
              }
            } else {
              segs.push(chunk);
            }
          } catch (e) {
            segs.push(chunk);
          }

          if (i + (CFG.CHUNK - 1) < pts.length - 1) {
            await sleep(CFG.CHUNK_DELAY_MS);
          }
        }
      } finally {
        $('snapOverlay').classList.add('hidden-i');
      }
      return segs.length ? segs : [pts];
    }

    /* ================================================================
       Recording & Simulation State Machine
       ================================================================ */
    var mode = 'idle';
    var watchId = null;
    var simTimer = null;
    var chipTimer = null;
    var active = null;
    var followUser = true;

    function newActive(kind) {
      return { kind: kind, start: Date.now(), pts: [], simSec: 0 };
    }

    function persistActive() {
      if (active && active.kind === 'gps' && active.pts.length) {
        lsSet(CFG.ACTIVE_KEY, { start: active.start, pts: active.pts });
      }
    }

    window.addEventListener('pagehide', persistActive);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') persistActive();
    });

    function setMode(next) {
      mode = next;
      var recBtn = $('btnRecord'), simBtn = $('btnSim');
      if (next === 'recording') {
        recBtn.dataset.state = 'on';
        recBtn.setAttribute('aria-pressed', 'true');
        $('recIcon').innerHTML = ICONS.stop;
        $('recText').textContent = 'Stop Ride';
        simBtn.disabled = true;
        setStatus('Recording', 'red');
        $('liveLabel').textContent = 'Live GPS';
        $('liveChip').classList.remove('hidden-i');
      } else if (next === 'sim') {
        simBtn.dataset.state = 'on';
        simBtn.setAttribute('aria-pressed', 'true');
        $('simIcon').innerHTML = ICONS.stop;
        $('simText').textContent = 'Stop Sim';
        recBtn.disabled = true;
        setStatus('Simulating', 'amber');
        $('liveLabel').textContent = 'ECP Sim';
        $('liveChip').classList.remove('hidden-i');
      } else {
        recBtn.dataset.state = 'off';
        recBtn.setAttribute('aria-pressed', 'false');
        recBtn.disabled = false;
        $('recIcon').innerHTML = ICONS.rec;
        $('recText').textContent = 'Record Ride';

        simBtn.dataset.state = 'off';
        simBtn.setAttribute('aria-pressed', 'false');
        simBtn.disabled = false;
        $('simIcon').innerHTML = ICONS.play;
        $('simText').textContent = 'Simulate';

        setStatus('Ready', '');
        $('liveChip').classList.add('hidden-i');
        clearInterval(chipTimer);
        chipTimer = null;
      }
    }

    function addPoint(lat, lng, t, acc, speedMps) {
      if (!active) return;
      var ll = [lat, lng];
      if (active.pts.length) {
        var last = active.pts[active.pts.length - 1];
        var d = hav([last.lat, last.lng], ll);
        if (d < CFG.MIN_STEP_M) return;
      }
      active.pts.push({ lat: lat, lng: lng, t: t || Date.now(), acc: acc || 10 });
      var path = active.pts.map(function (p) { return [p.lat, p.lng]; });
      liveLine.setLatLngs(path);
      updateUserMarker(lat, lng, acc, active.kind === 'sim');
      if (followUser) map.panTo(ll, { animate: true });

      var tempSet = new Set(cells);
      var newCovKm = coverSeg(path, tempSet);
      var rideKm = pathLenM(path) / 1000;
      var kmh = typeof speedMps === 'number' && speedMps >= 0 ? speedMps * 3.6 : 0;

      $('liveKm').textContent = rideKm.toFixed(2);
      $('livePts').textContent = active.pts.length;
      updateHUD(newCovKm, rideKm, kmh);
      persistActive();
    }

    function startChipTimer() {
      clearInterval(chipTimer);
      chipTimer = setInterval(function () {
        if (!active) return;
        var sec = active.kind === 'sim' ? active.simSec : (Date.now() - active.start) / 1000;
        $('liveTime').textContent = fmtDur(sec);
      }, 500);
    }

    function startRecording(resumeActive) {
      if (!navigator.geolocation) {
        toast('Geolocation is not supported on this device.', 'err');
        return;
      }
      haptic(25);
      followUser = true;
      $('btnLocate').dataset.active = 'true';
      if (!resumeActive) {
        active = newActive('gps');
      }
      setMode('recording');
      startChipTimer();

      watchId = navigator.geolocation.watchPosition(
        function (pos) {
          var c = pos.coords;
          if (c.accuracy && c.accuracy > CFG.MAX_ACC_M) return;
          addPoint(c.latitude, c.longitude, pos.timestamp || Date.now(), c.accuracy, c.speed);
        },
        function (err) {
          toast('GPS signal unavailable (' + err.message + ')', 'warn');
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    async function finishRide() {
      haptic([20, 40, 20]);
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      if (simTimer !== null) { clearInterval(simTimer); simTimer = null; }

      var finished = active;
      active = null;
      lsDel(CFG.ACTIVE_KEY);
      liveLine.setLatLngs([]);
      clearUserMarker();
      setMode('idle');

      if (!finished || finished.pts.length < 2) {
        updateHUD();
        toast('Ride too short to save.', 'warn');
        return;
      }

      var rawPath = finished.pts.map(function (p) { return [p.lat, p.lng]; });
      var rawKm = pathLenM(rawPath) / 1000;
      if (rawKm < CFG.MIN_SAVE_KM) {
        updateHUD();
        toast('Ride under 50m was not saved.', 'warn');
        return;
      }

      var snappedSegs = await snapToOSRM(rawPath);
      var snappedKm = 0;
      snappedSegs.forEach(function (s) { snappedKm += pathLenM(s) / 1000; });

      var beforeCov = coverageKm;
      data.rides.push({
        id: Date.now(),
        start: finished.start,
        end: Date.now(),
        km: snappedKm || rawKm,
        segs: snappedSegs
      });
      saveData();
      renderAllRides();

      var gainedKm = Math.max(0, coverageKm - beforeCov);
      toast('Saved! +' + gainedKm.toFixed(2) + ' km new SG roads explored.');
    }

    function startSimulation() {
      haptic(25);
      followUser = true;
      $('btnLocate').dataset.active = 'true';
      active = newActive('sim');
      setMode('sim');
      startChipTimer();

      var idx = 0;
      map.setView(ECP_ROUTE[0], 14);
      simTimer = setInterval(function () {
        if (idx >= ECP_ROUTE.length) {
          finishRide();
          return;
        }
        var pt = ECP_ROUTE[idx];
        active.simSec += CFG.SIM_SECONDS_PER_TICK;
        addPoint(pt[0], pt[1], Date.now(), 8, 18.5);
        idx++;
      }, CFG.SIM_TICK_MS);
    }

    /* ================================================================
       Button Bindings
       ================================================================ */
    $('recIcon').innerHTML = ICONS.rec;
    $('simIcon').innerHTML = ICONS.play;

    $('btnRecord').addEventListener('click', function () {
      if (mode === 'recording') finishRide();
      else if (mode === 'idle') startRecording(false);
    });

    $('btnSim').addEventListener('click', function () {
      if (mode === 'sim') finishRide();
      else if (mode === 'idle') startSimulation();
    });

    $('btnReset').addEventListener('click', async function () {
      if (mode !== 'idle') {
        toast('Stop active ride before resetting.', 'warn');
        return;
      }
      var ok = await confirmModal({
        title: 'Reset all road progress?',
        body: 'This will permanently delete all ' + data.rides.length + ' logged rides and reset your Singapore road coverage to 0.00%.',
        confirm: 'Delete All',
        cancel: 'Cancel',
        danger: true
      });
      if (!ok) return;
      data = { v: 1, rides: [], totalKm: 0 };
      lsDel(CFG.STORE_KEY);
      lsDel(CFG.ACTIVE_KEY);
      renderAllRides();
      toast('All rides and coverage reset.');
    });

    $('btnLandLot').addEventListener('click', function () {
      toggleLandLot();
      toast(prefs.landlot ? 'SLA LandLot Cadastral Overlay: ON' : 'SLA LandLot Cadastral Overlay: OFF');
    });

    $('btnLayers').addEventListener('click', function () {
      var nextIdx = (TILE_ORDER.indexOf(prefs.tiles) + 1) % TILE_ORDER.length;
      var nextKey = TILE_ORDER[nextIdx];
      setTiles(nextKey);
      toast('Map: ' + TILES[nextKey].name);
    });

    $('btnFit').addEventListener('click', function () {
      var pts = [];
      data.rides.forEach(function (r) {
        (r.segs || []).forEach(function (s) { pts = pts.concat(s); });
      });
      if (pts.length > 1) {
        followUser = false;
        $('btnLocate').dataset.active = 'false';
        map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 15 });
      } else {
        map.setView(CFG.CENTER, CFG.ZOOM);
        toast('No saved rides to frame yet.');
      }
    });

    $('btnLocate').addEventListener('click', function () {
      followUser = true;
      $('btnLocate').dataset.active = 'true';
      if (userMarker) {
        map.setView(userMarker.getLatLng(), 15);
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (pos) {
          var c = pos.coords;
          updateUserMarker(c.latitude, c.longitude, c.accuracy, false);
          map.setView([c.latitude, c.longitude], 15);
        }, function () {
          toast('Unable to fetch current location.', 'warn');
        });
      }
    });

    map.on('dragstart', function () {
      followUser = false;
      $('btnLocate').dataset.active = 'false';
    });

    /* ================================================================
       Boot & Interrupted Ride Recovery
       ================================================================ */
    renderAllRides();
    try {
      var allB = [];
      data.rides.slice(-5).forEach(function (r) { (r.segs || []).forEach(function (s) { allB = allB.concat(s); }); });
      if (allB.length > 1) map.fitBounds(L.latLngBounds(allB), { padding: [60, 60], maxZoom: 15 });
    } catch (e) {}

    var pending = lsGet(CFG.ACTIVE_KEY, null);
    if (pending && Array.isArray(pending.pts) && pending.pts.length >= 2) {
      var pkm = pathLenM(pending.pts.map(function (p) { return [p.lat, p.lng]; })) / 1000;
      setTimeout(async function () {
        var keep = await confirmModal({
          title: 'Unfinished ride found',
          body: 'A ride from ' + new Date(pending.start).toLocaleString('en-SG') + ' (' + pkm.toFixed(2) + ' km, ' + pending.pts.length + ' points) was interrupted. Snap it to roads and save it?',
          confirm: 'Save ride',
          cancel: 'Discard'
        });
        if (!keep) { lsDel(CFG.ACTIVE_KEY); return; }
        active = newActive('gps');
        active.start = pending.start || Date.now();
        pending.pts.forEach(function (p) { addPoint(p.lat, p.lng, p.t, p.acc); });
        var last = pending.pts[pending.pts.length - 1];
        active.start = Date.now() - Math.max(0, (last.t - pending.pts[0].t));
        setMode('recording');
        finishRide();
      }, 600);
    } else if (pending) {
      lsDel(CFG.ACTIVE_KEY);
    }

    if (!window.isSecureContext && location.protocol === 'file:') {
      setTimeout(function () { toast('Live GPS requires HTTPS. Simulation works anywhere.', 'warn', 4500); }, 800);
    }
  })();
  </script>
</body>
</html>
